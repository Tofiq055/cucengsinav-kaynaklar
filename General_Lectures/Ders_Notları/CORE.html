<!DOCTYPE html>
<html>
  <head>
    <title>homework tracker</title>
    <style>
      .pp{
        width: 50px;
        height: 50px;
        margin-left: 8px;
      }
      .d1{
        border-color: black;
        display: grid;
        grid-template-columns: 100px 1fr ;
      }
      .d2{
        
        display: flex;
        flex-direction: column;
        align-items:center;
        border-style: solid;
        border-width: 5px;
      }
      

    </style>

  </head>
  <body>
    <div class="d1">
      <div class="d2">
        <div>
          <img class="pp" src="Screenshot 2024-04-12 152140.png">
        </div>
        <div>
          <div><button>Lesson1</button></div>
          <div><button>Lesson2</button></div>
          <div><button>Lesson3</button></div>
          <div><button>Lesson4</button></div>
        </div>
      </div>

      <div style="border-style: solid;border-width: 5px; border-color: black;">
        <div style="background-color: rgb(163, 162, 159);margin: 10px;">
          <p>long text</p>
          <p>long text</p>
          <p>long text</p>
        </div>
      </div>
    </div>
    
  </body>
</html>
